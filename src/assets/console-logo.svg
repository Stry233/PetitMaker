<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 796 228" role="img" aria-label="PetitMaker &#35895;&#22320;&#24037;&#22346;">
<style>@media(prefers-color-scheme:dark){feFlood{flood-color:#EDE8E0}}</style>
<defs>
<image id="art" width="796" height="228" xlink:href="data:image/png;base64,"/>
<clipPath id="icon"><rect width="220.00" height="228"/></clipPath>
<clipPath id="name"><rect x="220.00" width="575.80" height="228"/></clipPath>
<filter id="ink"><feFlood flood-color="#43413F"/><feComposite in2="SourceAlpha" operator="in"/></filter>
</defs>
